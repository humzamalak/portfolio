name: Links

# Checks the external links on the site once a week (GitHub, LinkedIn, Medium and others).
# Internal links are checked on every change by the CI workflow.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - run: npm run build

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks automated requests (status 999), so it is excluded and checked by hand.
          # Fonts and analytics hosts are preconnect targets, not pages.
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude 'linkedin\.com'
            --exclude 'fonts\.(googleapis|gstatic)\.com'
            --exclude 'googletagmanager\.com'
            --exclude 'cloudflareinsights\.com'
            --accept '200..=299,403,429'
            'out/**/*.html'
          fail: false

      - name: Open an issue when a link is broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links on the site
          content-filepath: ./lychee/out.md
          labels: links
