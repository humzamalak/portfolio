name: CI

# Cloudflare Pages builds and deploys the site from GitHub. This workflow only checks each change.
on:
  push:
    branches: [master, main, netfliy-migration]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build static site
        run: npm run build

      - name: Check Cloudflare files are in the build
        run: test -f out/_headers && test -f out/_redirects && test -f out/robots.txt && test -f out/404.html
